<style>
/* ===== theme (Vidstuck dark values, Tailwind v4) ===== */
:root{
  --bg:#0a0a0a; --fg:#fafafa; --primary:#e5e5e5; --mut:#a1a1a1;
  --acc:#262626; --bd:rgba(255,255,255,.1); --bd2:rgba(255,255,255,.15);
  --red:#dc2626; --green:#05df72; --red400:#ff6568; --zinc900:#18181b;
  --r:.4rem; /* .4rem radius */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000}
body{font-family:Geist,Arial,sans-serif;color:var(--fg);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block;fill:currentColor}
.hidden{display:none!important}
/* v6.7: Android Chrome paints a blue tap highlight on every tap — kill it
   everywhere; keyboard focus keeps a visible ring via :focus-visible. */
*,*::before,*::after{-webkit-tap-highlight-color:transparent}
button{outline:none;touch-action:manipulation}
button:focus-visible,#seekTrack:focus-visible{outline:2px solid rgba(255,255,255,.65);outline-offset:2px}
#seekTrack{outline:none}

/* ===== stage ===== */
#vw{position:relative;height:100dvh;width:100%;overflow:hidden;background:#000}
#vw:fullscreen{background:#000}
#vw:fullscreen video{width:100%;height:100%}
#vid,#frm{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
#vid{object-fit:contain}
#grad{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;
  background:linear-gradient(to top,rgba(0,0,0,.8),transparent,rgba(0,0,0,.4));z-index:30}
/* v6.6: on embed lanes ONLY the server button overlays the
   embed's own player — no title block, no divider, no episodes button,
   no opaque bar; the embed fills the screen. */
#vw.embed #grad{display:none}
#vw.embed #topbar{background:transparent;padding:14px 16px}
#vw.embed #topbar .ttblock{display:none}
#vw.embed #topbar .topdiv{display:none}
#vw.embed #topbar #btnEpsTop{display:none}
#vw.embed #topbar .cbtn svg{filter:drop-shadow(0 1px 3px rgba(0,0,0,.85))}

/* ===== control buttons (cP) ===== */
.cbtn{position:relative;display:flex;align-items:center;justify-content:center;color:var(--fg);
  filter:brightness(.9);transition:filter .15s,opacity .15s;pointer-events:auto;flex:none}
.cbtn:hover{filter:brightness(1)}
.cbtn svg{width:28px;height:28px;transition:transform .3s ease-in-out}
.cbtn .tip{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);margin-bottom:8px;white-space:nowrap;
  border-radius:2px;background:rgba(0,0,0,.8);backdrop-filter:blur(20px);padding:4px 8px;font-size:14px;line-height:20px;
  opacity:0;transition:opacity .15s;pointer-events:none;z-index:50}
@media (hover:hover){.cbtn:hover .tip{opacity:1}}
.cbtn.tipshow .tip{opacity:1}
.cbtn .tip.below{bottom:auto;top:100%;margin-bottom:0;margin-top:8px}
/* v6.3: topbar buttons sit at the very top edge — a label ABOVE the button
   renders off-screen (measured top:-37 at 390px, clipped by #vw overflow).
   Topbar labels go BELOW the button, like the launcher cloud button. */
#topbar .cbtn .tip{bottom:auto;top:100%;margin-bottom:0;margin-top:8px}
@media (min-width:768px){.cbtn svg{width:32px;height:32px}}
@media (min-width:1024px){.cbtn svg{width:40px;height:40px}}
@media (orientation:landscape) and (max-height:500px){.cbtn svg{width:24px;height:24px}}
#btnSet svg{transition:transform .3s ease-in-out}
#btnSet:hover svg{transform:rotate(90deg)}

/* ===== top bar ===== */
#topbar{position:absolute;inset-inline:0;top:0;z-index:30;display:flex;align-items:center;gap:24px;
  padding:24px 16px;transition:opacity .3s ease-out,transform .3s ease-out}
#topbar .topdiv{height:36px;width:1px;border-radius:999px;background:var(--red);flex:none}
#topbar .ttblock{min-width:0}
#topbar .ttblock h3{font-size:12px;line-height:16px;color:var(--mut);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .ttblock h1{font-size:16px;line-height:22px;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .sp{flex:1}
@media (min-width:768px){
  #topbar{padding:32px 24px;gap:32px}
  #topbar .topdiv{display:none}
  #topbar .ttblock{display:none}
}
@media (orientation:landscape) and (max-height:500px){
  #topbar{padding:8px 8px;gap:8px}
  #topbar .ttblock h3{font-size:9.6px;line-height:12px}
  #topbar .ttblock h1{font-size:14px;line-height:18px}
}
#topbar.hide{opacity:0;transform:translateY(-30px);pointer-events:none}

/* ===== center controls (phone portrait only) ===== */
#centerCtl{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;gap:48px;z-index:30;
  transition:opacity .3s ease-out}
#centerCtl .cbtn svg{width:36px;height:36px}
#centerCtl #btnPlayC svg{width:48px;height:48px}
@media (min-width:768px){#centerCtl{display:none}}
@media (orientation:landscape){#centerCtl{display:none}}
#centerCtl.hide{opacity:0;pointer-events:none}

/* ===== double-tap indicators ===== */
.dtap{position:absolute;top:30%;transform:translateY(-50%);z-index:20;display:flex;flex-direction:column;
  align-items:center;justify-content:center;width:80px;height:80px;border-radius:50%;
  background:rgba(0,0,0,.5);color:#fff;backdrop-filter:blur(4px);pointer-events:none;
  font-size:18px;line-height:24px;font-weight:600;opacity:0;transition:opacity .2s}
.dtap small{font-size:10px;line-height:14px;color:rgba(255,255,255,.6);font-weight:400}
#dtL{left:20%}#dtR{right:20%}
.dtap.show{opacity:1}

/* ===== buffering spinner (ring) ===== */
.spinner{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:30;pointer-events:none;
  width:45px;height:45px;border-radius:50%;border:8px solid rgba(255,255,255,.2);border-top-color:#fff;
  animation:spin .9s linear infinite}
@media (min-width:768px){.spinner{width:60px;height:60px}}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}

/* ===== subtitles (custom cue overlay) ===== */
#cueWrap{position:fixed;inset-inline:0;bottom:0;pointer-events:none;z-index:30;display:flex;align-items:center;
  justify-content:center;transition:transform .15s ease-out;transform:translateY(-20px)}
#cueWrap.bars{transform:translateY(-80px)}
#cueBox{max-width:64rem;border-radius:6px;padding:12px;text-align:center;
  font-family:"Lexend Deca",Geist,Arial,sans-serif;font-weight:500;
  font-size:calc(clamp(0.875rem,2.5vw,2.25rem) * var(--cuescale,1));
  color:#fff;text-shadow:0 3px 8px rgba(0,0,0,.9);line-height:1.35;white-space:pre-wrap}
@media (min-width:768px){
  #cueWrap{transform:translateY(-40px)}
  #cueWrap.bars{transform:translateY(-140px)}
}
#vw.embed #cueWrap{display:none}
/* v6.20: captions removed from the player (his order) — the cue overlay
   never renders, and the Subtitles button is gone. Track plumbing stays
   inert (modes are "hidden"/"disabled", never natively rendered). */
#cueWrap{display:none}
#btnSubs{display:none}

/* ===== bottom bar ===== */
#botblock{position:absolute;inset-inline:0;bottom:0;z-index:30;display:flex;flex-direction:column;gap:12px;
  padding:24px 16px;transition:opacity .3s ease-out,transform .3s ease-out}
@media (min-width:768px){#botblock{padding:32px 24px;gap:20px}}
@media (orientation:landscape) and (max-height:500px){#botblock{padding:12px 12px;gap:4px}}
#botblock.hide{opacity:0;transform:translateY(30px);pointer-events:none}
#deskTitle{display:none}
@media (min-width:768px){
  #deskTitle{display:block;padding:0 4px}
  #deskTitle .kick{display:flex;align-items:center;gap:8px}
  #deskTitle .tick{height:16px;width:2px;border-radius:999px;background:var(--red);flex:none}
  #deskTitle .kick span{font-size:12px;line-height:16px;color:#9ca3af}
  #deskTitle h1{margin-top:8px;font-size:24px;line-height:30px;font-weight:700;letter-spacing:-.02em;text-shadow:0 1px 2px rgba(0,0,0,.5)}
  #deskTitle .pills{margin-top:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  #deskTitle .pills span{border-radius:999px;background:rgba(255,255,255,.1);padding:4px 10px;font-size:12px;line-height:16px;font-weight:500;color:#d1d5db}
}
@media (min-width:1024px){
  #deskTitle .kick span{font-size:16px;line-height:22px}
  #deskTitle h1{font-size:36px;line-height:40px}
}
/* seek */
#seekRow{display:flex;align-items:center;gap:12px;padding:0 4px;width:100%}
#seekTrack{position:relative;height:24px;flex:1;cursor:pointer;touch-action:none}
.deskTime{display:none;white-space:nowrap}
@media (min-width:768px){.deskTime{display:block;font-size:14px;line-height:20px;color:rgba(250,250,250,.8);font-variant-numeric:tabular-nums}}
#seekBar{position:absolute;left:0;right:0;top:50%;height:6px;transform:translateY(-50%);display:flex;gap:2px;
  border-radius:3px;overflow:hidden;background:rgba(255,255,255,.2);transition:transform .15s}
#skBuf{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.3)}

#seekTrack:hover #seekBar{transform:translateY(-50%) scaleY(1.5)}
#skThumb{position:absolute;top:50%;left:0;height:14px;width:6px;transform:translate(-50%,-50%);border-radius:2px;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.5);z-index:10;transition:transform .15s;pointer-events:none}
#seekTrack:hover #skThumb{transform:translate(-50%,-50%) scale(1.3)}
#seekHover{position:absolute;bottom:calc(100% + 6px);transform:translateX(-50%);border-radius:2px;background:rgba(0,0,0,.7);
  padding:4px 8px;font-size:14px;line-height:20px;font-variant-numeric:tabular-nums;color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.5);
  pointer-events:none;white-space:nowrap;display:none}
@media (min-width:768px){#seekHover.on{display:block}}
#timesRow{display:flex;justify-content:space-between;width:100%;padding:0 4px;
  font-size:14px;line-height:20px;color:rgba(250,250,250,.8);font-variant-numeric:tabular-nums}
@media (min-width:768px){#timesRow{display:none}}
/* controls row */
#ctlRow{display:flex;align-items:center;justify-content:center;gap:24px;width:100%}
@media (min-width:768px){#ctlRow{justify-content:flex-start}}
@media (orientation:landscape) and (max-height:500px){#ctlRow{gap:16px}}
#ctlRow .onlyDesk{display:none}
@media (min-width:768px){#ctlRow .onlyDesk{display:flex}}
@media (orientation:landscape) and (max-height:500px){#ctlRow .onlyDesk.playctl{display:flex}}
#ctlRow .onlyDeskNext{display:none}
@media (min-width:768px){#ctlRow .onlyDeskNext{display:flex}}
#ctlRow .sp{flex:1;display:none}
@media (min-width:768px){#ctlRow .sp{display:block}}
/* volume */
#volWrap{display:flex;align-items:center;gap:8px}
#volSliderWrap{width:0;overflow:hidden;opacity:0;transition:width .2s,opacity .2s;display:none}
@media (min-width:768px){#volSliderWrap{display:block}}
#volWrap:hover #volSliderWrap,#volWrap:focus-within #volSliderWrap{width:100px;opacity:1}
#volSlider{height:6px;width:100px;cursor:pointer;accent-color:#fff}

/* ===== paused overlay ===== */
#pausedOv{position:absolute;inset:0;z-index:29;display:flex;align-items:center;background:rgba(0,0,0,.7);
  backdrop-filter:blur(2px);pointer-events:none;user-select:none;font-family:Lexend,Geist,Arial,sans-serif}
#pausedOv .in{width:100%;max-width:48rem;padding:0 24px;transform:translateX(-20px);transition:transform .45s ease-out;opacity:0}
#pausedOv.show .in{transform:translateX(0);opacity:1}
@media (min-width:768px){#pausedOv .in{padding:0 64px}}
#pausedOv .prow{display:flex;align-items:center;gap:12px;margin-bottom:12px;font-size:14px;line-height:20px;
  font-weight:500;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.6)}
@media (min-width:768px){#pausedOv .prow{margin-bottom:20px}}
#pausedOv h1{font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:clamp(34px,5.4vw,64px);font-weight:800;letter-spacing:-.03em;line-height:1.04;color:#fff;text-shadow:0 4px 30px rgba(0,0,0,.6)} /* v6.5: same hero-banner name style on pause */
#pausedOv .tag{margin-top:8px;font-size:14px;line-height:20px;font-style:italic;color:rgba(255,255,255,.6)}
@media (min-width:768px){#pausedOv .tag{font-size:16px;line-height:24px}}
#pausedOv .meta{margin-top:8px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;font-size:14px;line-height:20px;color:rgba(255,255,255,.7)}
@media (min-width:768px){#pausedOv .meta{margin-top:16px}}
#pausedOv .genres{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
#pausedOv .genres span{border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:3px 10px;font-size:12px;line-height:16px;color:rgba(255,255,255,.8)}
#pausedOv .ov{margin-top:12px;font-size:14px;line-height:21px;color:rgba(255,255,255,.7);
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#pausedOv.show{pointer-events:auto}
#pausedOv .plogo{max-width:280px;max-height:110px;object-fit:contain;margin-bottom:12px;filter:drop-shadow(0 8px 24px rgba(0,0,0,.6))}
#vw.embed #pausedOv{display:none}
</style>
<style>

  var map = { hi:'Hindi', hin:'Hindi', en:'English', eng:'English', ta:'Tamil', tam:'Tamil', te:'Telugu', tel:'Telugu', ml:'Malayalam', mal:'Malayalam', kn:'Kannada', kan:'Kannada', bn:'Bengali', ben:'Bengali', mr:'Marathi', mar:'Marathi', pa:'Punjabi', pan:'Punjabi', gu:'Gujarati', guj:'Gujarati', ur:'Urdu', urd:'Urdu', es:'Spanish', spa:'Spanish', fr:'French', fra:'French', de:'German', deu:'German', ger:'German', it:'Italian', ita:'Italian', ja:'Japanese', jpn:'Japanese', pt:'Portuguese', por:'Portuguese', tr:'Turkish', tur:'Turkish', cs:'Czech', ces:'Czech', cze:'Czech', hu:'Hungarian', hun:'Hungarian', pl:'Polish', pol:'Polish', ar:'Arabic', ara:'Arabic', ru:'Russian', rus:'Russian', ko:'Korean', kor:'Korean', zh:'Chinese', zho:'Chinese', da:'Danish', dan:'Danish', nl:'Dutch', nld:'Dutch', sv:'Swedish', swe:'Swedish', no:'Norwegian', nor:'Norwegian', fi:'Finnish', fin:'Finnish', el:'Greek', ell:'Greek', th:'Thai', tha:'Thai', id:'Indonesian', ind:'Indonesian', ms:'Malay', msa:'Malay', vi:'Vietnamese', vie:'Vietnamese', fil:'Filipino', uk:'Ukrainian', ukr:'Ukrainian', he:'Hebrew', heb:'Hebrew', fa:'Persian', fas:'Persian', hrv:'Croatian', scr:'Croatian', nob:'Norwegian', nb:'Norwegian', ron:'Romanian', rum:'Romanian' };
  if (map[l]) return map[l];
  if (name) {
    var clean = name.replace(/^\s*(\[\d+\]|\d+\.)\s*/, '').trim();
    var n = clean.toLowerCase();
    var nativeMap = {
      'हिन्दी': 'Hindi', 'हिंदी': 'Hindi',
      'தமிழ்': 'Tamil', 'తెలుగు': 'Telugu',
      'മലയാളം': 'Malayalam', 'ಕನ್ನಡ': 'Kannada',
      'বাংলা': 'Bengali', 'मराठी': 'Marathi',
      'ਪੰਜਾਬੀ': 'Punjabi', 'ગુજરાતી': 'Gujarati',
      'اردو': 'Urdu'
    };
    for (var nk in nativeMap) { if (n.indexOf(nk) !== -1) return nativeMap[nk]; }
    if (/[^\x00-\x7F]/.test(clean)) return 'Audio';
    return clean.length > 14 ? clean.substring(0, 14) : clean;
  }
  return 'Audio';
}
function parseStream(s){
  var name = s.name || "", url = s.url || "", lang = "Unknown";
  try { var bi = name.indexOf("["), ei = name.indexOf("]"); if (bi >= 0 && ei > bi) lang = name.substring(bi + 1, ei); } catch (e) {}
  /* v6.21: umbrella labels ("[Multi-Audio]", "[Dual Audio]") name no language —
     treat as Unknown so the per-language tracks inside the HLS master
     (hls.audioTracks) are listed instead of one dead "Multi-Audio" row. */
  if (/^\s*(multi|dual)([\s\-_]|$)/i.test(lang)) lang = "Unknown";
  var qual = "Auto";
  if (s.quality) qual = s.quality;
  else if (url.indexOf("/1080/") > 0) qual = "1080p";
  else if (url.indexOf("/720/") > 0) qual = "720p";
  else if (url.indexOf("/480/") > 0) qual = "480p";
  else if (url.indexOf("/360/") > 0) qual = "360p";
  return { url: url, lang: prettyLang(lang, lang), qual: qual, name: name, force: !!s.forceHls, format: s.format || "", subs: s.subtitles || s.subs || [] };
}

/* v6.5: server rows are name-only (user order) — no quality kid-rows, no

}
function ckSvg(){ return '<svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>'; }
function xSvg(){ return '<svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>'; }
function clockSvg(){ return '<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 10.59l4.24 2.49-.75 1.23L11 13V7h2v5.59z"/></svg>'; }

/* ONE delegated listener: grid taps, Prev/Next, season menu all share it. */
$("epBody").addEventListener("click", function(e){

<script>
/* ============ playback ============ */
var hls = null, curStreams = [];
var video = $("vid"), frame = $("frm");
var setDoubleTap = true, setAutoNext = false;
var aspectMode = "contain", speedVal = 1, qualityLabel = "Auto";
var failChain = [], hlsFailed = false;
var embedTimer1 = null, embedTimer2 = null, embedTimer3 = null, watchdogArmed = false;
var EMBED_STUCK_MS = 45000, EMBED_COUNTDOWN_MS = 10000;
var barsHidden = false, barTimer = null, cueBound = false, selectedSubIdx = -1;
/* v6.3 tap-toggle state: hideTimer2 = pending hide after a single tap (300ms,
   so a second tap can still double-tap-seek); dtFired = a double-tap seek just
   fired on touchstart; touchShowed = this tap's touchstart already showed the
   bars, so the click that follows must not hide them again. */
var hideTimer2 = null, dtFired = false, touchShowed = false;

function showSpin(on){ $("bigSpin").classList.toggle("hidden", !on); }
function isNativeLane(){ return curServer && laneOf(curServer) === "native" && !video.classList.contains("hidden"); }
function isEmbedLane(){ return curServer && laneOf(curServer) === "embed" && !frame.classList.contains("hidden"); }
function stopAll(){
  cancelWatchdog();
  try { if (hls) { hls.destroy(); hls = null; } } catch (e) {}
  try { video.pause(); video.removeAttribute("src"); video.load(); } catch (e) {}
  try { frame.src = "about:blank"; } catch (e) {}
  $("pausedOv").classList.add("hidden"); $("pausedOv").classList.remove("show");
  cueBound = false; selectedSubIdx = -1; $("cueBox").textContent = "";
}
function applyLaneChrome(){
  var emb = !!isEmbedLane();
  $("vw").classList.toggle("embed", emb);
  if (emb) {
    $("botblock").classList.add("hidden");
    $("centerCtl").classList.add("hidden");
    $("btnBack").classList.add("hidden");
    $("btnCloudTop").classList.remove("hidden");
    $("topbar").classList.remove("hide");
    barsHidden = false;
  } else {
    $("botblock").classList.remove("hidden");
    $("centerCtl").classList.remove("hidden");
    $("btnBack").classList.remove("hidden");
  }

}
/* v6.5: autoplay attempts go through attemptPlay — play with sound, one
   muted retry on rejection, then a clean paused state. A rejected play()
   used to leave the spinner visible forever on a loaded-but-paused video. */
var curStreams = [];
var curStreamIdx = 0;
var mutedByAutoplay = false; /* v6.24: set only by the muted autoplay retry — a play press restores sound. */
function attemptPlay(){
  if (!isNativeLane()) return;
  var p = null;
  try { p = video.play(); } catch (e) { p = null; }
  if (p && typeof p.catch === "function") p.catch(function(){
    if (!isNativeLane()) return;
    video.muted = true; mutedByAutoplay = true; syncVolIcon();
    var p2 = null;
    try { p2 = video.play(); } catch (e2) { p2 = null; }
    if (p2 && typeof p2.catch === "function") p2.catch(function(){
      if (video.readyState >= 2) showSpin(false);
      updatePlayIco();
    });
  });
}
var appliedSubsKey = "";
function applySubsFor(st){
  var subs = (st && st.subs) || [];
  var key = subs.map(function(x){ return x.url || ""; }).join("|");
  if (key === appliedSubsKey) return;
  appliedSubsKey = key;
  var olds = video.querySelectorAll("track");
  for (var i = 0; i < olds.length; i++) olds[i].remove();
  for (var j = 0; j < subs.length; j++) {
    var tr = document.createElement("track");
    tr.kind = "subtitles";
    tr.label = prettyLang(subs[j].label || subs[j].lang || "", subs[j].lang || "");
    tr.srclang = subs[j].lang || "";
    tr.src = subs[j].url;
    tr.addEventListener("load", function(){ bindTextTracks(); refreshSettingsIfOpen(); });
    video.appendChild(tr);
  }
  selectedSubIdx = -1;
  syncCue();
}
function playPickedStream(st, pos, autoplay){
  showSpin(true);
  hlsFailed = false;
  video.classList.remove("hidden");
  frame.classList.add("hidden");
  applyVideoPrefs();
  /* v6.8: never leave the other surface running — pause the video, blank
     the embed frame and cancel its watchdog before the new stream. */
  try { video.pause(); } catch(e){}
  cancelWatchdog();
  try { frame.src = "about:blank"; } catch(e){}
  if (hls) { try { hls.destroy(); } catch(e){} hls = null; }
  applySubsFor(st);
  var decUrl = st.url; try { decUrl = decodeURIComponent(st.url); } catch(e){}
  if (window.Hls && Hls.isSupported() && (st.force || st.format === "hls" || /\.m3u8/i.test(decUrl))) {
    hls = new Hls({ maxBufferLength: 30 });
    hls.loadSource(st.url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, function(){
      try { video.currentTime = pos; } catch(e){}
      if (autoplay) attemptPlay(); else if (video.readyState >= 2) showSpin(false);
      qualityLabel = "Auto";
      bindTextTracks(); refreshSettingsIfOpen();
    });
    hls.on(Hls.Events.AUDIO_TRACKS_UPDATED, refreshSettingsIfOpen);
    hls.on(Hls.Events.LEVEL_SWITCHED, function(ev, data){
      try {
        if (hls.autoLevelEnabled) qualityLabel = "Auto";
        else if (hls.levels && hls.levels[data.level] && hls.levels[data.level].height) qualityLabel = hls.levels[data.level].height + "p";
      } catch(e){}
      refreshSettingsIfOpen();
    });
    hls.on(Hls.Events.SUBTITLE_TRACKS_UPDATED, function(){ bindTextTracks(); refreshSettingsIfOpen(); });
    hls.on(Hls.Events.ERROR, function(ev, data){
      if (data && data.fatal && !hlsFailed) { hlsFailed = true; showSpin(false); failoverFrom(curServer, serverName(curServer) + " stream failed"); }
    });
  } else {
    video.src = st.url;
    var h = function(){
      video.removeEventListener("loadedmetadata", h);
      try { video.currentTime = pos; } catch(e){}
      if (autoplay) attemptPlay(); else if (video.readyState >= 2) showSpin(false);
      refreshSettingsIfOpen();
    };
    video.addEventListener("loadedmetadata", h);
  }
}
function playNative(streams){
  curStreams = streams.map(parseStream).filter(function(x){ return x.url; });
  if (!curStreams.length) { failoverFrom(curServer, "No streams found on this server"); return; }
  var pick = curStreams[0], hi = -1;
  for (var i = 0; i < curStreams.length; i++) if (/hindi/i.test(curStreams[i].lang)) { hi = i; break; }
  if (hi >= 0) pick = curStreams[hi];
  curStreamIdx = curStreams.indexOf(pick);
  /* v6.6: MP4 lanes have no HLS levels; show the picked stream's quality. */
  if (pick.qual && !pick.force) qualityLabel = pick.qual;
  playPickedStream(pick, 0, true);
  applyLaneChrome();
}
function playEmbed(srv){
  var url = embedUrl(srv);
  if (!url) { toast("Embed URL could not be built"); return; }
  /* v6.8: stop the native surface — a hidden video keeps playing audio. */
  try { if (hls) { hls.destroy(); hls = null; } } catch(e){}
  try { video.pause(); video.removeAttribute("src"); video.load(); } catch(e){}
  cancelWatchdog();
  video.classList.add("hidden"); frame.classList.remove("hidden");
  /* sandbox rule (live player): sandbox ONLY on hindi/Vega */
  if (srv === "hindi") frame.setAttribute("sandbox", "allow-same-origin allow-scripts allow-presentation allow-forms");
  else frame.removeAttribute("sandbox");

     embed's own player. */
  showSpin(false);

frame.addEventListener("load", function(){
  var src = frame.getAttribute("src") || "";
  if (src && src !== "about:blank" && $("launcher").classList.contains("hidden")) showSpin(false);
});
/* ---- embed watchdog: cross-origin iframes cannot report failure ---- */
function cancelWatchdog(){
  clearTimeout(embedTimer1); clearTimeout(embedTimer2); clearInterval(embedTimer3);
  embedTimer1 = embedTimer2 = embedTimer3 = null;
  watchdogArmed = false;
}
function disarmWatchdog(){
  cancelWatchdog();
  $("toast").classList.add("hidden");
  clearTimeout(toast._to);
}
/* Re-arm after a panel is dismissed: opening a panel disarms the watchdog
   (intended — a user picking a server must not be yanked mid-choice), but
   dismissing the panel without choosing left an embed lane with no timeout
   at all. Re-arm only for a live embed lane behind a hidden launcher. */
function maybeRearmWatchdog(){
  if (watchdogArmed) return;
  if (!isEmbedLane()) return;
  if (!$("launcher").classList.contains("hidden")) return;
  var src = $("frm").getAttribute("src") || "";
  if (!src || src === "about:blank") return;
  armWatchdog(curServer);
}
function armWatchdog(srv){
  cancelWatchdog();
  watchdogArmed = true;
  embedTimer1 = setTimeout(function(){
    if (!watchdogArmed) return;
    var next = nextFailoverCandidate(srv);
    var nextName = next ? serverName(next) : null;
    var remain = Math.round(EMBED_COUNTDOWN_MS / 1000);
    var msg = function(n){
      return serverName(srv) + " has not started yet — " + (nextName ? nextName + " will be tried" : "the server panel will open") + " in " + n + " seconds. Tap the cloud button to stop.";
    };
    toast(msg(remain), EMBED_COUNTDOWN_MS + 1500);
    clearInterval(embedTimer3);
    embedTimer3 = setInterval(function(){
      if (!watchdogArmed) { clearInterval(embedTimer3); embedTimer3 = null; return; }
      remain--;
      if (remain <= 0) { clearInterval(embedTimer3); embedTimer3 = null; return; }
      var t = $("toastTxt");
      if (t && !$("toast").classList.contains("hidden")) t.textContent = msg(remain);
    }, 1000);
    embedTimer2 = setTimeout(function(){
      clearInterval(embedTimer3); embedTimer3 = null;
      if (!watchdogArmed) return;
      watchdogArmed = false;
      failoverFrom(srv, serverName(srv) + " did not respond");
    }, EMBED_COUNTDOWN_MS);
  }, EMBED_STUCK_MS);
}
function nextFailoverCandidate(failedId){
  var lane = laneOf(failedId);
  var ordered = SERVERS.filter(function(s){ return s.lane === lane && s.id !== failedId; })
    .concat(SERVERS.filter(function(s){ return s.lane !== lane; }));
  for (var i = 0; i < ordered.length; i++) {
    if (failChain.indexOf(ordered[i].id) < 0) return ordered[i].id;
  }
  return null;
}
function failoverFrom(failedId, why){
  var next = nextFailoverCandidate(failedId);
  if (!next) {
    toast((why ? why + " — " : "") + "No server responded. Please choose a server.");
    renderSrvPanel(); openPop("srvPanel");
    return;
  }
  toast((why ? why + " — " : "") + "Trying " + serverName(next));
  openPlayer(next, false);
}
function openPlayer(srvId, manual){
  stopAll();
  curServer = srvId;
  if (manual) failChain = [srvId];
  else if (failChain.indexOf(srvId) < 0) failChain.push(srvId);
  closeAllSheets();
  $("launcher").classList.add("hidden");
  $("watchTitle").textContent = META.title + (MEDIA_TYPE === "tv" ? "  S" + MEDIA_SEASON + " E" + MEDIA_EPISODE : "");
  $("deskH1").textContent = META.title + (MEDIA_TYPE === "tv" ? "  S" + MEDIA_SEASON + " E" + MEDIA_EPISODE : "");
  var pills = '<span>' + META.kind + '</span>';
  if (META.genres && META.genres.length) pills += '<span>' + META.genres[0] + '</span>';
  if (META.year) pills += '<span>' + META.year + '</span>';
  $("deskPills").innerHTML = pills;
  $("btnEpsTop").classList.toggle("hidden", MEDIA_TYPE !== "tv");
  buildPausedOv();
  syncNextEpBtn();
  renderSrvPanel();
  var srv = serverById(srvId);
  if (srv && srv.lane === "native") {
    var p = PROBE[srvId];
    if (p && p.streams && p.streams.length) playNative(p.streams);
    else {
      showSpin(true);
      probeRW(srv).then(function(r){
        PROBE[srvId] = r; showSpin(false);
        if (r.ok) playNative(r.streams);
        else failoverFrom(srvId, serverName(srvId) + ": no stream found");
        renderSrvPanel();
        refreshSettingsIfOpen();
      });
    }

    playEmbed(srvId);
  }

}
function backToLauncher(){
  stopAll();
  disarmWatchdog();
  closeAllSheets();
  $("launcher").classList.remove("hidden");
  if (bestIdx >= 0) { setStatus("Ready"); setSrcLine(SERVERS[bestIdx].name, bestIdx); }
}

/* ============ bars auto-hide + paused overlay ============ */
function povMetaLine(){

  if (META.runtime) parts.push(fmtRuntime(META.runtime));
