<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vidstuck Clone — Test Preview v4</title>
<!-- VS-CLONE-V4 -->
<!-- VS-CLONE-V4-EPFIX -->
<style>
:root{
  --bg:#000; --panel:#0a0a0a; --panel2:#0e0e0e; --row:#262626; --row2:#2e2e2e;
  --border:#262626; --txt:#fff; --mut:#9ca3af; --mut2:#d1d1d1;
  --red:#e11d2e; --green:#22c55e; --tap:48px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input[type=range]{cursor:pointer}
.hidden{display:none !important}
svg{display:block}

/* ============ LAUNCHER (v2 look, kept) ============ */
#launcher{position:fixed;inset:0;overflow:hidden;background:#000}
#lauBg{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(28px) saturate(1.05);transform:scale(1.12)}
#lauShade{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,.45) 0%,rgba(0,0,0,.72) 55%,rgba(0,0,0,.94) 100%)}
.floatIco{position:absolute;z-index:5;width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.floatIco svg{width:30px;height:30px;fill:#fff;filter:drop-shadow(0 2px 8px rgba(0,0,0,.8))}
#btnBackL{top:calc(22px + env(safe-area-inset-top));left:35px}
#btnBackL svg{width:28px;height:28px}
#btnCloudL{top:calc(20px + env(safe-area-inset-top));right:30px}
#btnCloudL svg{width:38px;height:38px}
#lauCenter{position:absolute;z-index:4;left:0;right:0;top:50%;transform:translateY(-58%);display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 20px}
#logoImg{max-width:min(480px,84vw);max-height:112px;object-fit:contain;filter:drop-shadow(0 4px 24px rgba(0,0,0,.7))}
#lauTitle{font-size:clamp(38px,6vw,64px);font-weight:800;letter-spacing:-.02em;line-height:1.05;text-shadow:0 4px 30px rgba(0,0,0,.8)}
#lauGenre{margin-top:14px;font-size:14px;font-weight:600;letter-spacing:.28em;color:var(--mut2);text-transform:uppercase}
#lauStatus{margin-top:30px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:18px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
#lauStatus .cur{display:inline-block;width:.6em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#lauProg{margin-top:16px;width:300px;max-width:70vw;height:4px;border-radius:99px;background:#3a3a3a;overflow:hidden}
#lauProgFill{height:100%;width:4%;background:#fff;border-radius:99px;transition:width .4s}
#lauSrc{margin-top:14px;font-size:16px;font-weight:500}
#lauSrc .sl{color:var(--mut)}
#lauHint{position:absolute;z-index:4;left:0;right:0;bottom:calc(7% + env(safe-area-inset-bottom));text-align:center;font-size:17px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.8);padding:0 20px}

/* ============ STAGE ============ */
#stage{position:fixed;inset:0;background:#000}
#vw{position:relative;width:100%;height:100%;background:#000;overflow:hidden}
#vw video,#vw iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
#vw video{object-fit:contain}
#bigSpin{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;width:52px;height:52px;border-radius:50%;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;animation:sp .8s linear infinite}
@keyframes sp{to{transform:translate(-50%,-50%) rotate(360deg)}}
#topbar{position:absolute;top:0;left:0;right:0;height:90px;z-index:7;background:#000;display:flex;align-items:center;justify-content:space-between;padding:0 28px;transition:opacity .25s}
#topbar.hide,#botblock.hide{opacity:0;pointer-events:none}
.tbtn{width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.tbtn svg{width:28px;height:28px;fill:#fff}
#btnCloudTop{border:1px solid #4b4b4b;border-radius:9px}
#btnCloudTop svg{width:24px;height:24px}
/* embed lanes: ONLY the cloud button is ours — everything else hidden */
#btnCloudFloat{position:absolute;z-index:8;top:calc(20px + env(safe-area-inset-top));right:22px;width:46px;height:46px;display:none;align-items:center;justify-content:center;border:1px solid #4b4b4b;border-radius:10px;background:rgba(0,0,0,.55)}
#btnCloudFloat svg{width:26px;height:26px;fill:#fff}
#stage.embed #topbar,#stage.embed #botblock,#stage.embed #pausedOv{display:none !important}
#stage.embed #btnCloudFloat{display:flex}
#botblock{position:absolute;left:0;right:0;bottom:0;z-index:7;background:#000;padding:16px 28px calc(18px + env(safe-area-inset-bottom));transition:opacity .25s}
#titleBlock{text-align:left;margin-bottom:12px}
#titleBlock .watch{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:17px;font-weight:500}
#titleBlock .watch::before{content:"";width:3px;height:18px;background:var(--red);border-radius:2px}
#titleBlock h2{font-size:36px;font-weight:800;line-height:1.15;margin:2px 0 8px}
#titleBlock .pills{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pillTag{background:#1f1f1f;border-radius:99px;padding:5px 13px;font-size:13px;color:var(--mut2);font-weight:500}
#epHint{font-size:13px;color:var(--mut);font-weight:600;padding:5px 4px}
#seekRow{display:flex;align-items:center;gap:14px;margin-bottom:6px}
#seekRow .tm{font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
#seek{flex:1;appearance:none;-webkit-appearance:none;height:5px;border-radius:99px;background:#333;outline:none}
#seek::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;border:0}
#seek::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:0}
#ctlRow{display:flex;align-items:center;justify-content:space-between;min-height:70px}
.ctlGroup{display:flex;align-items:center;gap:28px}
.cbtn{width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.cbtn svg{width:31px;height:31px;fill:#fff}
.cbtn:disabled{opacity:.35}
#volwrap{display:flex;align-items:center;gap:10px;position:relative}
#volSlider{width:0;opacity:0;transition:width .2s,opacity .2s;appearance:none;-webkit-appearance:none;height:5px;border-radius:99px;background:#e5e5e5;outline:none}
#volwrap:hover #volSlider,#volwrap:focus-within #volSlider{width:80px;opacity:1}
#volSlider::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#fff;border:0}
#volSlider::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:#fff;border:0}
#volTip{position:absolute;bottom:calc(100% + 14px);left:50%;transform:translateX(-50%);white-space:nowrap;z-index:9;pointer-events:none;background:#000;border:1px solid var(--border);border-radius:99px;padding:6px 14px;font-size:13px;font-weight:600}
/* paused overlay (native lanes only) */
#pausedOv{position:absolute;z-index:6;left:28px;bottom:230px;max-width:580px;text-align:left;pointer-events:none}
#pausedOv .p1{color:var(--mut);font-size:15px;letter-spacing:.3em;font-weight:600}
#pausedOv .pT{font-family:"Segoe Script","Brush Script MT",cursive;font-size:60px;line-height:1.1;font-weight:400;margin:6px 0}
#pausedOv .pTag{font-style:italic;font-size:18px;color:#e5e5e5}
#pausedOv .pMeta{margin-top:8px;font-size:16px;color:var(--mut2)}
#pausedOv .pPills{display:flex;gap:8px;margin-top:10px}
#pausedOv .pPills span{border:1px solid #6b6b6b;border-radius:99px;padding:5px 14px;font-size:13px;color:var(--mut2)}
#pausedOv .pOv{margin-top:12px;font-size:15px;line-height:1.5;color:#c9c9c9;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ============ BOTTOM SHEETS (servers / settings / audio / subtitles) ============ */
.sheet{position:fixed;z-index:32;left:50%;transform:translateX(-50%);bottom:0;width:min(640px,100vw);max-height:76vh;background:var(--panel2);border:1px solid #1c1c1c;border-bottom:0;border-radius:18px 18px 0 0;display:flex;flex-direction:column;box-shadow:0 -14px 44px rgba(0,0,0,.6)}
.sheet .grab{width:100px;height:5px;border-radius:99px;background:#737373;margin:10px auto 6px;flex:none}
.sheet .shead{display:flex;align-items:center;padding:8px 20px 12px;flex:none}
.sheet .shead h3{font-size:22px;font-weight:800}
.sheet .shead .x{margin-left:auto;width:44px;height:44px;font-size:20px;display:flex;align-items:center;justify-content:center}
.sheet .sbody{overflow-y:auto;padding:0 16px calc(16px + env(safe-area-inset-bottom));flex:1;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:#2e2e2e transparent}
.sheet .sbody::-webkit-scrollbar{width:6px}
.sheet .sbody::-webkit-scrollbar-thumb{background:#2e2e2e;border-radius:99px}
.sheet .sbody::-webkit-scrollbar-track{background:transparent}
.sheet .sfoot{flex:none;padding:12px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet .sfoot button{width:100%;min-height:52px;border-radius:9px;background:var(--row);font-size:17px;font-weight:600}
.bkrow{display:flex;align-items:center;gap:10px;width:100%;min-height:var(--tap);padding:8px 10px;border-radius:10px;font-size:16px;font-weight:700;text-align:left}
.bkrow:active{background:var(--row)}
.bkrow svg{width:22px;height:22px;fill:#fff;flex:none}
.srvsec{color:var(--mut);font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:16px 8px 4px}
.srvsec .sub{display:block;text-transform:none;letter-spacing:0;font-weight:500;font-size:13.5px;color:var(--mut);margin-top:3px}
.srv{display:flex;flex-direction:column;gap:2px;padding:10px 10px;border-radius:9px;text-align:left;width:100%}
.srv:active{background:var(--row)}
.srv.sel{background:var(--row2)}
.srv .r1{display:flex;align-items:center;gap:10px}
.srv .nm{font-size:17px;font-weight:700}
.srv.fail .nm{color:#8a8a8a;text-decoration:line-through}
.srv .st{margin-left:auto;font-size:15px;font-weight:600;white-space:nowrap}
.srv .st.ok{color:var(--green)}
.srv .st.bad{color:var(--red)}
.srv .st.dim{color:var(--mut)}
.srv .ds{font-size:15px;color:var(--mut);margin-top:2px}
.srv .ck{font-size:17px;font-weight:700}
.kids{margin:2px 0 4px 14px;padding-left:14px;border-left:1px solid #333}
.kid{display:flex;align-items:center;gap:10px;min-height:44px;padding:6px 10px;border-radius:8px;text-align:left;width:100%;font-size:16px;font-weight:500}
.kid.sel{background:#2a2a2a;font-weight:700}
.kid .st{margin-left:auto;font-size:15px;font-weight:600}
.kid .st.ok{color:var(--green)}
.kid .st.dim{color:var(--mut)}
.kid .st.bad{color:var(--red)}
.opt{display:flex;align-items:center;gap:10px;min-height:var(--tap);padding:6px 10px;border-radius:9px;font-size:16px;font-weight:500;text-align:left;width:100%}
.opt:active{background:var(--row)}
.opt.sel{background:var(--row2);font-weight:700}
.opt .ck{margin-left:auto;font-weight:700}
.cardnote{font-size:13.5px;line-height:1.55;color:var(--mut);padding:10px}
.sheet .foot{margin-top:10px;padding:12px 8px 2px;border-top:1px solid var(--border);text-align:center;color:var(--mut);font-size:14px}
/* Vidstuck desktop geometry: Servers + Audio/Subtitles are RIGHT-SIDE cards;
   Settings is the only centered sheet. Below 641px all cards become bottom sheets. */
@media(min-width:641px){
  #srvPanel{left:auto;right:25px;top:90px;bottom:auto;transform:none;width:370px;max-width:calc(100vw - 50px);height:440px;max-height:calc(100vh - 110px);border:1px solid #1c1c1c;border-radius:14px;box-shadow:0 14px 44px rgba(0,0,0,.6)}
  #audioSheet,#subsSheet{left:auto;right:25px;top:auto;bottom:250px;transform:none;width:360px;max-width:calc(100vw - 50px);max-height:min(380px,calc(100vh - 270px));border:1px solid #1c1c1c;border-radius:14px;box-shadow:0 14px 44px rgba(0,0,0,.6)}
  #settings{top:88px;bottom:0;width:570px;max-width:calc(100vw - 32px);max-height:none;border-radius:18px 18px 0 0}
  #srvPanel .grab,#audioSheet .grab,#subsSheet .grab{display:none}
  #srvPanel .shead .x{display:none}
}
/* accordion */
.acc{border-top:1px solid var(--border);margin-top:6px}
.acc-head{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:8px 10px;text-align:left;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.acc-head .chev{margin-left:auto;color:var(--mut);font-size:18px;transition:transform .15s}
.acc.open .acc-head .chev{transform:rotate(90deg)}
.acc-body{display:none;padding:2px 0 8px}
.acc.open .acc-body{display:block}
/* settings rows */
.srow{display:flex;align-items:center;gap:14px;min-height:64px;padding:8px 10px;border-radius:10px;text-align:left;width:100%}
.srow:active{background:var(--row)}
.srow .ic{flex:none;width:44px;height:44px;border-radius:9px;background:var(--row);display:flex;align-items:center;justify-content:center}
.srow .ic svg{width:23px;height:23px;fill:#fff}
.srow .lb{font-size:17px;font-weight:600}
.srow .vl{margin-left:auto;color:var(--mut);font-size:16px;white-space:nowrap}
.srow .chev{color:var(--mut);font-size:18px;margin-left:8px}
.srow .tgl{margin-left:auto;font-size:16px;font-weight:600;color:var(--mut2)}
.srow .tgl.on{color:#fff}
.subhead{display:flex;align-items:center;gap:10px;padding:8px 6px 12px}
.subhead .bk{width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.subhead .bk svg{width:24px;height:24px;fill:#fff}
.subhead .bk{width:auto;gap:6px;padding:0 8px 0 2px}
.subhead .bk span{font-size:16px;font-weight:700}
.subhead h3{font-size:22px;font-weight:800}
/* episodes */
.epnav2{display:flex;gap:8px;margin:0 2px 12px}
.epnav2 button{flex:1;min-height:var(--tap);border-radius:12px;border:1px solid var(--border);font-weight:700;font-size:15px;background:#141414}
.epnav2 button:disabled{opacity:.4}
.seasrow{display:flex;gap:8px;overflow-x:auto;padding:2px 4px 12px;-webkit-overflow-scrolling:touch}
.seasrow button{flex:none;min-width:56px;height:46px;padding:0 16px;border-radius:99px;border:1px solid var(--border);font-weight:700;font-size:15px;background:#141414}
.seasrow button.sel{background:#fff;color:#000;border-color:#fff}
.epgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding:0 2px}
.epcard{min-height:60px;padding:10px 12px;border-radius:13px;border:1px solid var(--border);text-align:left;background:#141414}
.epcard:active{background:#222}
.epcard.sel{border-color:var(--red)}
.epcard .n{font-size:12px;color:var(--red);font-weight:800;letter-spacing:.06em}
.epcard .t{font-size:14px;font-weight:600;line-height:1.3;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* toast: bottom-right dark card */
#toast{position:fixed;z-index:40;right:22px;bottom:26px;max-width:min(360px,86vw);background:#111;border:1px solid #2a2a2a;border-radius:10px;padding:13px 16px;font-size:15px;font-weight:600;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.6)}
#toast .x{margin-left:4px;font-size:16px;color:var(--mut)}
@media(max-width:640px){
  #topbar{height:64px;padding:0 14px}
  #botblock{padding:12px 14px calc(14px + env(safe-area-inset-bottom))}
  #titleBlock h2{font-size:27px}
  #titleBlock .watch{font-size:15px}
  .ctlGroup{gap:14px}
  #pausedOv{left:14px;bottom:190px;max-width:86vw}
  #pausedOv .pT{font-size:44px}
  #btnBackL{left:12px}
  #btnCloudL{right:10px}
  #btnCloudFloat{right:12px}
  #lauStatus{font-size:15px}
  #toast{left:14px;right:14px;bottom:20px;max-width:none}
}
</style>
</head>
<body>
<!-- ================= LAUNCHER ================= -->
<section id="launcher">
  <div id="lauBg"></div>
  <div id="lauShade"></div>
  <button class="floatIco" id="btnBackL" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
  <button class="floatIco" id="btnCloudL" aria-label="Servers"><svg viewBox="0 0 24 24"><path d="M19.35 10.04A7.49 7.49 0 0 0 12 4C9.11 4 6.6 5.64 5.35 8.04A5.994 5.994 0 0 0 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/></svg></button>
  <div id="lauCenter">
    <img id="logoImg" class="hidden" alt="">
    <div id="lauTitle">—</div>
    <div id="lauGenre"></div>
    <div id="lauStatus"><span id="lauStatusTxt">INITIALIZING</span><span class="cur">_</span></div>
    <div id="lauProg"><div id="lauProgFill"></div></div>
    <div id="lauSrc"><span id="lauSrcName">—</span> <span class="sl">/ Source 01</span></div>
  </div>
  <div id="lauHint">Tap a failed server to try it again.</div>
</section>

<!-- ================= STAGE ================= -->
<section id="stage" class="hidden">
  <div id="vw">
    <video id="vid" playsinline preload="auto" class="hidden"></video>
    <iframe id="frm" class="hidden" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; fullscreen *; gyroscope; picture-in-picture; web-share" referrerpolicy="origin"></iframe>
    <div id="bigSpin" class="hidden"></div>
    <div id="pausedOv" class="hidden">
      <div class="p1">PAUSED</div>
      <div class="pT" id="pTitle"></div>
      <div class="pTag" id="pTag"></div>
      <div class="pMeta" id="pMeta"></div>
      <div class="pPills" id="pPills"></div>
      <div class="pOv" id="pOv"></div>
    </div>
    <div id="topbar">
      <button class="tbtn" id="btnBack" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
      <button class="tbtn" id="btnCloudTop" aria-label="Servers"><svg viewBox="0 0 24 24"><path d="M19.35 10.04A7.49 7.49 0 0 0 12 4C9.11 4 6.6 5.64 5.35 8.04A5.994 5.994 0 0 0 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/></svg></button>
    </div>
    <button id="btnCloudFloat" aria-label="Change server"><svg viewBox="0 0 24 24"><path d="M19.35 10.04A7.49 7.49 0 0 0 12 4C9.11 4 6.6 5.64 5.35 8.04A5.994 5.994 0 0 0 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/></svg></button>
    <div id="botblock">
      <div id="titleBlock">
        <div class="watch">You're Watching</div>
        <h2 id="watchTitle">—</h2>
        <div class="pills" id="watchPills"></div>
      </div>
      <div id="seekRow">
        <span class="tm" id="tCur">0:00</span>
        <input type="range" id="seek" min="0" max="100" step="0.1" value="0" aria-label="Seek">
        <span class="tm" id="tTot">0:00</span>
      </div>
      <div id="ctlRow">
        <div class="ctlGroup" id="ctlLeft">
          <button class="cbtn" id="btnPlay" aria-label="Play or pause"><svg viewBox="0 0 24 24" id="playIco"><path d="M8 5v14l11-7z"/></svg></button>
          <button class="cbtn" id="btnBack15" aria-label="Back 15 seconds"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H4a7 7 0 1 0 8-7z"/><text x="12" y="16.5" text-anchor="middle" font-size="8" font-weight="800" fill="#fff">15</text></svg></button>
          <button class="cbtn" id="btnFwd15" aria-label="Forward 15 seconds"><svg viewBox="0 0 24 24"><path d="M12 5V2l5 4-5 4V7a5 5 0 1 0 5 5h2a7 7 0 1 1-8-7z"/><text x="12" y="16.5" text-anchor="middle" font-size="8" font-weight="800" fill="#fff">15</text></svg></button>
          <span id="volwrap">
            <button class="cbtn" id="btnMute" aria-label="Mute"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg></button>
            <input type="range" id="volSlider" min="0" max="1" step="0.05" value="1" aria-label="Volume">
            <div id="volTip" class="hidden">Volume</div>
          </span>
        </div>
        <div class="ctlGroup" id="ctlRight">

<script>
"use strict";

function serverById(id){ var s = SERVERS.filter(function(x){ return x.id === id; })[0]; return s || null; }

  if (srv === "vidcore") {
    if (MEDIA_TYPE === "tv") return "https://vidcore.net/tv/" + MEDIA_TMDB + "/" + MEDIA_SEASON + "/" + MEDIA_EPISODE + "?theme=E50914";

  if (srv === "cinesrc") {
    if (MEDIA_TYPE === "tv") return "https://cinesrc.st/embed/tv/" + MEDIA_TMDB + "?s=" + MEDIA_SEASON + "&e=" + MEDIA_EPISODE;

}
function streamsUrl(base, provider){
  var t = MEDIA_TYPE === "tv" ? "series" : "movie";
  var u = base + "/api/streams/" + provider + "/" + t + "/" + MEDIA_TMDB;
  if (MEDIA_TYPE === "tv") u += "?season=" + MEDIA_SEASON + "&episode=" + MEDIA_EPISODE;
  return u;
}
function thugtvApiUrl(){
  if (MEDIA_TYPE === "tv") return "https://thugtv.online/api/stream/tv/" + MEDIA_TMDB + "/" + MEDIA_SEASON + "/" + MEDIA_EPISODE;
  return "https://thugtv.online/api/stream/movie/" + MEDIA_TMDB;
}
function stripPreviews(d){
  if (d && d.streams) d.streams = d.streams.filter(function(s){ return !/preview/i.test(s.url || ""); });
  return d;
}
function fetchJSON(url, ms){
  return new Promise(function(res){
    var done = false, to = setTimeout(function(){ if (!done) { done = true; res(null); } }, ms || 8000);
    fetch(url).then(function(r){ return r.json(); }).then(function(d){ if (!done) { done = true; clearTimeout(to); res(d); } })
    .catch(function(){ if (!done) { done = true; clearTimeout(to); res(null); } });
  });
}
function fetchJSONProxy(url, ms){ return fetchJSON(WORKER + encodeURIComponent(url), ms); }
function probeRW(srv){
  var provider = srv.rw, url;
  if (provider === "thugtv") url = thugtvApiUrl();
  else if (provider === "moviebox") url = streamsUrl(VELVET_API, provider);
  else url = streamsUrl(CASTLE_API, provider);
  return fetchJSON(url, 8000).then(function(d){
    if (d) return d;
    return fetchJSONProxy(url, 8000);
  }).then(function(d){
    if (!d) return { ok: false, streams: [], unreachable: true };
    d = stripPreviews(d);
    var list = [];
    if (d.streams && d.streams.length) list = d.streams;
    else if (d.url) list = [{ url: d.url, name: d.name || "", quality: d.quality || "" }];
    else if (Array.isArray(d)) list = d;
    return { ok: list.length > 0, streams: list, raw: d };
  }).catch(function(){ return { ok: false, streams: [] }; });
}
var PROBE = {}; /* id -> {ok, streams, unreachable} */
var bestIdx = -1;

/* ============ helpers ============ */

/* ============ launcher ============ */
$("lauBg").style.backgroundImage = META.bg ? ("url('" + META.bg + "')") : "none";
if (META.logo) {

/* probe + status cycle (native lanes only; embeds have no probe) */
var probeDone = 0, probeTotal = 0;
(function probeAll(){
  var rwServers = SERVERS.filter(function(s){ return s.rw; });
  probeTotal = rwServers.length;
  setStatus("INITIALIZING"); setSrc("—"); setProg(4);
  /* Status sequencer: CHECKING / CONNECTING TO for every probed server, ~300ms
     dwell per state, first state painted immediately. READY waits for the probes
     AND the full sequence, so fast probes never skip states. */
  var SEQ_DWELL = 300, seqIdx = 0, seqDone = false;
  var seqNames = rwServers.map(function(s){ return s.name; });
  var seqTotal = seqNames.length * 2;
  function showSeq(i){
    var nm = seqNames[Math.floor(i / 2)];
    setStatus((i % 2 ? "CONNECTING TO " : "CHECKING ") + nm);
    setSrc(nm);
  }
  if (seqTotal > 0) showSeq(0); else seqDone = true;
  var cycTimer = seqTotal > 0 ? setInterval(function(){
    seqIdx++;
    if (seqIdx < seqTotal) showSeq(seqIdx);
    else { seqDone = true; clearInterval(cycTimer); maybeFinish(); }
  }, SEQ_DWELL) : null;
  var finished = false, probesDone = false;
  function maybeFinish(){
    if (finished || !probesDone || !seqDone) return;
    finishProbe();
  }
  rwServers.forEach(function(srv){
    probeRW(srv).then(function(r){
      PROBE[srv.id] = r; probeDone++;
      setProg(10 + 80 * probeDone / Math.max(1, probeTotal));
      renderSrvPanel();
      if (probeDone >= probeTotal) { probesDone = true; maybeFinish(); }
    });
  });
  setTimeout(function(){ if (probeDone < probeTotal) { probesDone = true; maybeFinish(); } }, 9500);
  function finishProbe(){
    if (finished) return; finished = true;
    if (cycTimer) clearInterval(cycTimer);
    SERVERS.forEach(function(srv){ if (PROBE[srv.id] === undefined) PROBE[srv.id] = { ok: false, streams: [] }; });
    bestIdx = -1;
    for (var i = 0; i < SERVERS.length; i++) {
      if (SERVERS[i].lane === "native" && PROBE[SERVERS[i].id].ok) { bestIdx = i; break; }
    }
    if (bestIdx < 0) bestIdx = 5; /* Nova, first embed server */
    setStatus("READY"); setSrc(SERVERS[bestIdx].name); setProg(100);
    renderSrvPanel();
    setTimeout(function(){
      if (!$("launcher").classList.contains("hidden")) openPlayer(SERVERS[bestIdx].id, false);
    }, 650);
  }
})();

/* ============ server panel: two lists + back + episodes (TV) ============ */
var epAccOpen = false;
function streamQuals(streams){
  var seen = {}, out = [];
  (streams || []).forEach(function(s){
    var q = parseStream(s).qual;
    if (!seen[q]) { seen[q] = 1; out.push(q); }
  });
  return out;
}
function srvRowHtml(srv){
  var p = PROBE[srv.id];
  var sel = srv.id === curServer;
  var h = "";
  if (srv.lane === "native") {
    if (p === undefined) {
      h += '<button class="srv' + (sel ? " sel" : "") + '" data-srv="' + srv.id + '"><span class="r1"><span class="nm">' + srv.name + '</span><span class="st dim">…</span></span><span class="ds">Checking…</span></button>';
    } else if (p.unreachable) {
      h += '<button class="srv' + (sel ? " sel" : "") + '" data-srv="' + srv.id + '"><span class="r1"><span class="nm">' + srv.name + '</span>' + (sel ? '<span class="st ck">✓</span>' : '<span class="st dim">—</span>') + '</span><span class="ds">Check nahi hua</span></button>';
    } else if (!p.ok) {
      h += '<button class="srv fail' + (sel ? " sel" : "") + '" data-srv="' + srv.id + '"><span class="r1"><span class="nm">' + srv.name + '</span><span class="st bad">×</span></span><span class="ds">No usable sources found</span></button>';
    } else {
      var qs = streamQuals(p.streams);
      h += '<button class="srv' + (sel ? " sel" : "") + '" data-srv="' + srv.id + '"><span class="r1"><span class="nm">' + srv.name + '</span>' + (sel ? '<span class="st ck">✓</span>' : '<span class="st ok">' + p.streams.length + ' streams</span>') + '</span><span class="ds">' + srv.ds + '</span></button>';
      if (qs.length) {
        h += '<div class="kids">' + qs.map(function(q, qi){
          return '<button class="kid' + (qi === 0 ? " sel" : "") + '" data-srv="' + srv.id + '"><span>' + q + '</span><span class="st ' + (qi === 0 ? "ok" : "dim") + '">Ready</span></button>';
        }).join("") + '</div>';

  } else if (srv.id === "vidstuck") {
    h += '<button class="srv' + (sel ? " sel" : "") + '" data-srv="' + srv.id + '"><span class="r1"><span class="nm">' + srv.name + '</span>' + (sel ? '<span class="st ck">✓</span>' : "") + '</span><span class="ds">' + srv.ds + '</span></button>' +

         '<button class="kid sel" data-srv="vidstuck"><span>360p</span><span class="st ok">Ready</span></button>' +
         '<button class="kid" data-srv="vidstuck"><span>480p</span><span class="st dim">Queue</span></button>' +
         '<button class="kid" data-srv="vidstuck"><span>720p</span><span class="st dim">Queue</span></button></div>';
  } else {
    h += '<button class="srv' + (sel ? " sel" : "") + '" data-srv="' + srv.id + '"><span class="r1"><span class="nm">' + srv.name + '</span>' + (sel ? '<span class="st ck">✓</span>' : '<span class="st dim">—</span>') + '</span><span class="ds">' + srv.ds + '</span></button>';
  }
  return h;
}
function srvListsHtml(){
  var h = '<div class="srvsec">Our servers<span class="sub">Apna player — seek, subtitles, audio hamare controls se</span></div>';
  SERVERS.forEach(function(srv){ if (srv.lane === "native") h += srvRowHtml(srv); });
  h += '<div class="srvsec">Embed servers<span class="sub">Inke apne controls — seek/subtitles embed ke andar</span></div>';

/* ============ episodes (inside the server panel) ============ */
var curSeason = MEDIA_SEASON;
function epCount(season){ return META.seasons ? (META.seasons[season] || 0) : 0; }
function epName(season, ep){
  if (META.epNames && META.epNames[season] && META.epNames[season][ep - 1]) return META.epNames[season][ep - 1];
  return "Episode " + ep;
}
function renderEpAcc(){
  var head = $("epAccHead"), box = $("epAccBody");
  if (!head || !box) return;
  if (!head._epHeadBound) {
    head._epHeadBound = true;
    head.addEventListener("click", function(){
      epAccOpen = !epAccOpen;
      $("epAcc").classList.toggle("open", epAccOpen);
      if (epAccOpen) renderEpAcc();
    });
  }
  if (!epAccOpen) return;
  var sh = "";
  var seasons = META.seasons ? Object.keys(META.seasons).map(Number).sort(function(a, b){ return a - b; }) : [1];
  seasons.forEach(function(sn){
    sh += '<button class="' + (sn === curSeason ? "sel" : "") + '" data-season="' + sn + '">Season ' + sn + "</button>";
  });
  var gh = "", n = epCount(curSeason);
  for (var ep = 1; ep <= n; ep++) {
    var sel = (curSeason === MEDIA_SEASON && ep === MEDIA_EPISODE);
    gh += '<button class="epcard' + (sel ? " sel" : "") + '" data-ep="' + ep + '"><span class="n">EPISODE ' + ep + "</span><span class=\"t\">" + epName(curSeason, ep) + "</span></button>";
  }
  if (!n) gh = '<p class="cardnote">Is show ke episodes ki list demo data me nahi hai.</p>';
  box.innerHTML = '<div class="epnav2"><button id="btnPrevEp2">‹ Previous episode</button><button id="btnNextEp2">Next episode ›</button></div>' +
    '<div class="seasrow">' + sh + '</div><div class="epgrid">' + gh + "</div>";
  Array.prototype.forEach.call(box.querySelectorAll("[data-season]"), function(b){
    b.addEventListener("click", function(){ curSeason = parseInt(b.getAttribute("data-season"), 10); renderEpAcc(); });
  });
  Array.prototype.forEach.call(box.querySelectorAll("[data-ep]"), function(b){
    b.addEventListener("click", function(){ switchEpisode(curSeason, parseInt(b.getAttribute("data-ep"), 10)); });
  });
  var bp = $("btnPrevEp2"), bn = $("btnNextEp2");
  if (bp) bp.addEventListener("click", function(){ stepEpisode(-1); });
  if (bn) bn.addEventListener("click", function(){ stepEpisode(1); });
  updateEpButtons();
}
function updateEpButtons(){
  var n = epCount(MEDIA_SEASON), hasPrev = !(MEDIA_SEASON === 1 && MEDIA_EPISODE === 1);
  var seasons = META.seasons ? Object.keys(META.seasons).map(Number) : [1];
  var maxS = Math.max.apply(null, seasons);
  var hasNext = (MEDIA_EPISODE < n) || (MEDIA_SEASON < maxS);
  if ($("btnPrevEp2")) { $("btnPrevEp2").disabled = !hasPrev; $("btnNextEp2").disabled = !hasNext; }
}
function switchEpisode(s, e){
  MEDIA_SEASON = s; MEDIA_EPISODE = e; curSeason = s;
  var q = new URLSearchParams(location.search);
  q.set("type", "tv"); q.set("tmdb", MEDIA_TMDB); q.set("s", String(s)); q.set("e", String(e));
  history.replaceState(null, "", location.pathname + "?" + q.toString());

}
function stepEpisode(dir){
  var n = epCount(MEDIA_SEASON);
  var s = MEDIA_SEASON, e = MEDIA_EPISODE + dir;
  if (e < 1) { s = s - 1; e = epCount(s); }
  if (e > n) { s = s + 1; e = 1; }
  if (s < 1 || !epCount(s)) return;
  switchEpisode(s, e);
}

/* ============ playback ============ */
var curServer = null, hls = null, curStreams = [];
var video = $("vid"), frame = $("frm");
var setDoubleTap = false, setAutoNext = false;
var failChain = [], hlsFailed = false;
var embedTimer1 = null, embedTimer2 = null, embedTimer3 = null, watchdogArmed = false;
var EMBED_STUCK_MS = 45000, EMBED_COUNTDOWN_MS = 10000;
function stopAll(){
  cancelWatchdog();
  try { if (hls) { hls.destroy(); hls = null; } } catch (e) {}
  try { video.pause(); video.removeAttribute("src"); video.load(); } catch (e) {}
  try { frame.src = "about:blank"; } catch (e) {}
  $("pausedOv").classList.add("hidden");
}
function parseStream(s){
  var name = s.name || "", url = s.url || "", lang = "Unknown";
  try { var bi = name.indexOf("["), ei = name.indexOf("]"); if (bi >= 0 && ei > bi) lang = name.substring(bi + 1, ei); } catch (e) {}
  var qual = "Auto";
  if (s.quality) qual = s.quality;
  else if (url.indexOf("/1080/") > 0) qual = "1080p";
  else if (url.indexOf("/720/") > 0) qual = "720p";
  else if (url.indexOf("/480/") > 0) qual = "480p";
  else if (url.indexOf("/360/") > 0) qual = "360p";
  return { url: url, lang: lang, qual: qual, name: name };
}
function showSpin(on){ $("bigSpin").classList.toggle("hidden", !on); }
function isNativeLane(){ return curServer && laneOf(curServer) === "native" && !video.classList.contains("hidden"); }
function isEmbedLane(){ return curServer && laneOf(curServer) === "embed" && !frame.classList.contains("hidden"); }
function applyLaneChrome(){
  /* Embed lanes: ONLY the cloud button (CSS hides topbar/botblock/paused overlay).
     Native lanes: full real chrome. */
  $("stage").classList.toggle("embed", !!isEmbedLane());
  pokeBars();
}
function playNative(streams){
  curStreams = streams.map(parseStream).filter(function(x){ return x.url; });
  if (!curStreams.length) { failoverFrom(curServer, "Is server par koi stream nahi mili"); return; }
  var pick = curStreams[0], hi = -1;
  for (var i = 0; i < curStreams.length; i++) if (/hindi/i.test(curStreams[i].lang)) { hi = i; break; }
  if (hi >= 0) pick = curStreams[hi];
  showSpin(true);
  hlsFailed = false;
  video.classList.remove("hidden"); frame.classList.add("hidden");
  if (window.Hls && Hls.isSupported() && /\.m3u8/i.test(pick.url)) {
    hls = new Hls({ maxBufferLength: 30 });
    hls.loadSource(pick.url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, function(){ video.play().catch(function(){}); });
    hls.on(Hls.Events.ERROR, function(ev, data){
      if (data && data.fatal && !hlsFailed) { hlsFailed = true; showSpin(false); failoverFrom(curServer, serverName(curServer) + " ka stream toot gaya"); }
    });
  } else {
    video.src = pick.url;
    video.play().catch(function(){});
  }
  applyLaneChrome();
}
function playEmbed(srv){
  var url = embedUrl(srv);
  if (!url) { toast("Embed URL nahi bani"); return; }
  video.classList.add("hidden"); frame.classList.remove("hidden");
  /* sandbox rule (live player): sandbox ONLY on hindi/Vega */
  if (srv === "hindi") frame.setAttribute("sandbox", "allow-same-origin allow-scripts allow-presentation allow-forms");
  else frame.removeAttribute("sandbox");

}

/* ---- embed watchdog: cross-origin iframes cannot report failure, so a
   bounded wait + visible ticking countdown is the honest failover.
   Opening any panel, tapping the cloud button, switching servers
   manually, or returning to the launcher cancels the pending advance
   immediately (the user is managing it). One auto-advance per
   server-open, max. Single timer source: embedTimer1/2/3. ---- */
function cancelWatchdog(){
  clearTimeout(embedTimer1); clearTimeout(embedTimer2); clearInterval(embedTimer3);
  embedTimer1 = embedTimer2 = embedTimer3 = null;
  watchdogArmed = false;
}
function disarmWatchdog(){
  /* User took over: cancel timers AND dismiss the stale countdown toast. */
  cancelWatchdog();
  $("toast").classList.add("hidden");
  clearTimeout(toast._to);
}
function armWatchdog(srv){
  cancelWatchdog();
  watchdogArmed = true;
  embedTimer1 = setTimeout(function(){
    if (!watchdogArmed) return;
    var next = nextFailoverCandidate(srv);
    var nextName = next ? serverName(next) : null;
    var remain = Math.round(EMBED_COUNTDOWN_MS / 1000);
    var msg = function(n){
      return serverName(srv) + " abhi tak nahi chala — " + n + " second me " + (nextName ? nextName + " try hoga" : "server panel khulega") + ". Rokne ke liye cloud button dabao.";
    };
    toast(msg(remain), EMBED_COUNTDOWN_MS + 1500);
    clearInterval(embedTimer3);
    embedTimer3 = setInterval(function(){
      if (!watchdogArmed) { clearInterval(embedTimer3); embedTimer3 = null; return; }
      remain--;
      if (remain <= 0) { clearInterval(embedTimer3); embedTimer3 = null; return; }
      var t = $("toastTxt");
      if (t && !$("toast").classList.contains("hidden")) t.textContent = msg(remain);
    }, 1000);
    embedTimer2 = setTimeout(function(){
      clearInterval(embedTimer3); embedTimer3 = null;
      if (!watchdogArmed) return;
      watchdogArmed = false;
      failoverFrom(srv, serverName(srv) + " ne jawab nahi diya");
    }, EMBED_COUNTDOWN_MS);
  }, EMBED_STUCK_MS);
}
function nextFailoverCandidate(failedId){
  var lane = laneOf(failedId);
  var ordered = SERVERS.filter(function(s){ return s.lane === lane && s.id !== failedId; })
    .concat(SERVERS.filter(function(s){ return s.lane !== lane; }));
  for (var i = 0; i < ordered.length; i++) {
    if (failChain.indexOf(ordered[i].id) < 0) return ordered[i].id;
  }
  return null;
}
function failoverFrom(failedId, why){
  var next = nextFailoverCandidate(failedId);
  if (!next) {
    toast((why ? why + " — " : "") + "koi server jawab nahi de raha, server chuno");
    openSrvPanel();
    return;
  }
  toast((why ? why + " — " : "") + serverName(next) + " try ho raha hai");
  openPlayer(next, false);
}
function openPlayer(srvId, manual){
  stopAll();
  curServer = srvId;
  if (manual) failChain = [srvId];
  else if (failChain.indexOf(srvId) < 0) failChain.push(srvId);
  closeAllSheets();
  $("launcher").classList.add("hidden");
  $("stage").classList.remove("hidden");
  $("watchTitle").textContent = META.title + (MEDIA_TYPE === "tv" ? "  S" + MEDIA_SEASON + " E" + MEDIA_EPISODE : "");
  var pills = '<span class="pillTag">' + META.kind + '</span>';
  (META.genres || []).forEach(function(g){ pills += '<span class="pillTag">' + g + '</span>'; });
  if (META.year) pills += '<span class="pillTag">' + META.year + '</span>';
  if (MEDIA_TYPE === "tv") pills += '<button id="epHint" class="pillTag" style="cursor:pointer">Episodes ›</button>';
  $("watchPills").innerHTML = pills;
  var eh = $("epHint");
  if (eh) eh.addEventListener("click", function(){ openSrvPanel({ episodes: true }); });
  $("pTitle").textContent = META.title;
  $("pTag").textContent = META.tagline || "";
  $("pMeta").textContent = [META.year, META.runtime, META.rate ? "★ " + META.rate : ""].filter(Boolean).join(" • ");
  $("pPills").innerHTML = (META.genres || []).map(function(g){ return "<span>" + g + "</span>"; }).join("");
  $("pOv").textContent = META.ov || "";
  updateEpButtons();
  renderSrvPanel();
  var srv = serverById(srvId);
  if (srv && srv.lane === "native") {
    var p = PROBE[srvId];
    if (p && p.streams && p.streams.length) playNative(p.streams);
    else {
      showSpin(true);
      probeRW(srv).then(function(r){
        PROBE[srvId] = r; showSpin(false);
        if (r.ok) playNative(r.streams);
        else failoverFrom(srvId, serverName(srvId) + " par stream nahi mili");
        renderSrvPanel();
      });
    }
  } else {
    playEmbed(srvId);
  }
  pokeBars();
}

    });
  }
  Array.prototype.forEach.call(body.querySelectorAll("[data-acc-head]"), function(b){
    b.addEventListener("click", function(){
      var key = b.getAttribute("data-acc-head");
      openSec = (openSec === key) ? null : key;
      renderSettings();
    });
  });
  Array.prototype.forEach.call(body.querySelectorAll("[data-acc-back]"), function(b){
    b.addEventListener("click", function(){ openSec = null; renderSettings(); });
  });
  Array.prototype.forEach.call(body.querySelectorAll("[data-act]"), function(b){
    b.addEventListener("click", function(){
      var act = b.getAttribute("data-act");
      if (act === "servers") { setView = "servers"; renderSettings(); }
      else if (act === "quality" || act === "subs" || act === "audio") { setView = "sub"; setSub = act; renderSettings(); }
      else if (act === "autonext") { setAutoNext = !setAutoNext; renderSettings(); }
      else if (act === "doubletap") { setDoubleTap = !setDoubleTap; renderSettings(); }
    });
  });
}
$("btnSet").addEventListener("click", function(){ disarmWatchdog(); setView = "main"; openSec = null; renderSettings(); closeAllSheets(); $("settings").classList.remove("hidden"); });
$("btnCloseSet").addEventListener("click", function(){ $("settings").classList.add("hidden"); });

/* Opening any panel cancels a pending embed auto-advance (user is managing it) */
["srvPanel", "settings", "audioSheet", "subsSheet"].forEach(function(id){
  $(id).addEventListener("click", function(){ disarmWatchdog(); }, true);
});

/* ============ deep link: ?play=1 auto-opens best server ============ */
if (qp.get("play") === "1") {
  var iv = setInterval(function(){
    if (bestIdx >= 0) { clearInterval(iv); openPlayer(SERVERS[bestIdx].id, false); }
  }, 500);
  setTimeout(function(){ clearInterval(iv); }, 12000);
}
</script>
</body>
