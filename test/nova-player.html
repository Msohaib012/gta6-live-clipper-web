/* ===== theme (Vidstuck dark values, Tailwind v4) ===== */
:root{

  filter:brightness(.9);transition:filter .15s,opacity .15s;pointer-events:auto;flex:none}

/* v6.5: sheets animate in/out with transitions (was a .1s popIn keyframe +
   instant close = "popup" feel). Base state = pre-animation; .open = final. */
.popBk{position:absolute;inset:0;z-index:60;background:rgba(10,10,10,.5);opacity:0;transition:opacity .22s ease}
.popBk.open{opacity:1}
.popover{position:absolute;z-index:60;display:flex;flex-direction:column;gap:10px;border-radius:6.4px;
  background:rgba(10,10,10,.8);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);
  padding:4px;font-size:14px;line-height:20px;box-shadow:0 25px 50px rgba(0,0,0,.5);overflow:hidden;
  opacity:0;transform:translateY(8px) scale(.98);transition:opacity .22s ease,transform .22s ease}
.popover.open{opacity:1;transform:none}
#srvPanel{width:288px;right:12px;top:72px;max-height:calc(100dvh - 150px)}
@media (min-width:768px){#srvPanel{width:356px;right:24px;top:88px}}
/* v6.3: phone card was 288px with a 200px scroll window for 780px of content
   and overlapped the topbar by 14px (measured). Wider, taller, below the bar. */
@media (max-width:767px){
  #srvPanel{width:min(340px,calc(100vw - 24px));top:92px;max-height:calc(100dvh - 170px)}
  .kid{padding:10px 12px}
}
.pop2{width:min(356px,calc(100vw - 24px));right:12px;bottom:150px;max-height:calc(100dvh - 230px)}
@media (min-width:768px){.pop2{right:24px;bottom:210px}}
.popHead{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--bd);padding:12px 16px;
  font-size:12px;line-height:16px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
@media (min-width:768px){.popHead{font-size:14px;line-height:20px}}
.popHead svg{width:20px;height:20px;flex:none}
#setPopBack{display:flex;align-items:center;color:var(--fg);flex:none;margin-left:-6px}
#setPopBack svg{width:20px;height:20px;stroke:currentColor;stroke-width:1.4px}
.popScroll{overflow-y:auto;padding:0 8px 8px;scrollbar-width:thin}
#srvPanel .popScroll{max-height:240px} /* v6.38: compact rows — 4 servers visible at once */
@media (min-width:768px){#srvPanel .popScroll{max-height:calc(100dvh - 212px)}} /* v6.40: PC — all 7 server rows visible, no scroll (panel cap 150px + head 44 + gap 10 + pad 8) */
@media (min-width:768px){#audioSheet .popScroll{max-height:calc(100dvh - 292px)}} /* v6.40: PC ONLY — audio list fills the sheet, no scroll (panel cap 230px + head 44 + gap 10 + pad 8). Subtitles untouched. */
.pop2 .popScroll{max-height:320px}
/* v6.3: this phone override must come AFTER the base 200px rule above
   (same specificity — later wins). First placement lost to source order. */
@media (max-width:767px){#srvPanel .popScroll{max-height:320px}}
.srvsec{padding:12px 12px 6px;font-size:13px;line-height:20px;font-weight:700;text-transform:uppercase;
  letter-spacing:.16em;color:rgba(255,255,255,.45)}
.srvsec:first-child{padding-top:2px}
.srvsec ~ .srvsec{border-top:1px solid rgba(255,255,255,.09);margin-top:8px}
.srv{display:flex;width:100%;flex-direction:column;align-items:stretch;text-align:left;border-radius:8px;
  padding:8px 12px;font-size:14px;line-height:20px;transition:background-color .15s,color .15s;color:var(--fg)}
.srv:hover{background:rgba(38,38,38,.6);color:var(--fg)}
.srv.sel{background:var(--acc);color:var(--fg)}
@media (min-width:768px){.srv{font-size:16px;line-height:24px}}
.srv .r1{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px}
.srv .nm{font-weight:500;color:inherit}
.srv.sel .nm{font-weight:600}
.srv.fail .nm{text-decoration:line-through;opacity:.5}
.srv .ds{margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-size:12px;line-height:16px;color:var(--mut);text-align:left}
@media (min-width:768px){.srv .ds{font-size:14px;line-height:20px}}
.st{flex:none;display:flex;align-items:center}
.st svg{width:16px;height:16px}
.st.ok{color:var(--primary)}
.st.bad{color:var(--red400)}
.st.dim{opacity:.4}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;
  animation:spin2 .7s linear infinite;flex:none}
@keyframes spin2{to{transform:rotate(360deg)}}
.kids{margin-left:16px;margin-top:6px;padding-left:8px;border-left:1px solid var(--bd);display:flex;flex-direction:column;gap:2px}
.kid{display:flex;width:100%;align-items:center;justify-content:space-between;border-radius:6px;
  padding:8px 12px;font-size:14px;line-height:20px;font-weight:500;text-align:left;transition:background-color .15s}
.kid:hover{background:rgba(38,38,38,.6)}
.kid.sel{background:var(--acc)}
.kid.dis{cursor:not-allowed;opacity:.4}
.kid.dis .kl{text-decoration:line-through}
.kid .ks{font-size:12px;line-height:16px;text-transform:capitalize;font-weight:400}
.kid .ks.ready{color:var(--green)}
.kid .ks.conn{color:var(--mut)}
.kid .ks.failed{color:var(--red400)}
.kid .ks.queue{opacity:.4}
.popFoot{border-top:1px solid var(--bd);padding:8px}
.popFoot p{display:flex;justify-content:space-between;gap:12px;padding:4px 12px;font-size:12px;line-height:16px;color:var(--mut)}
.popFoot p span:last-child{text-align:right}
.opt{display:flex;width:100%;align-items:center;justify-content:space-between;border-radius:8px;
  padding:10px 12px;font-size:16px;line-height:24px;text-align:left;transition:background-color .15s;
  animation:rowIn .3s ease-out both}
.opt:hover{background:rgba(38,38,38,.7)}
.opt.sel{background:var(--acc)}
.opt svg{width:16px;height:16px;color:var(--primary);flex:none}
@keyframes rowIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.popEmpty{padding:24px 12px;text-align:center;font-size:14px;line-height:20px;color:var(--mut)}

/* ===== drawers (settings / episodes) ===== */
#drawerBk{position:absolute;inset:0;z-index:60;background:rgba(10,10,10,.5);opacity:0;transition:opacity .3s ease}
#drawerBk.open{opacity:1}
.drawer{position:absolute;left:0;right:0;bottom:0;z-index:60;margin:0 auto;display:flex;flex-direction:column;
  background:var(--bg);
  border-radius:6.4px 6.4px 0 0;max-height:90dvh;font-size:14px;line-height:20px;
  translate:0 26px;opacity:0;transition:translate .3s cubic-bezier(.22,1,.36,1),opacity .3s ease,transform 450ms cubic-bezier(.22,1,.36,1);will-change:transform;overflow:hidden}
.drawer.open{translate:0 0;opacity:1}
#settings{max-width:576px;background:rgba(10,10,10,.62);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.1)}
#epDrawer{max-width:1024px;max-height:90vh}
/* v6.3: settings is a CENTERED sheet on phones (Vidstuck's form), not a
   bottom sheet. Episodes stay a bottom sheet. Drag-close is episodes-only
   now: a drag transform would fight the centering translate. */
@media (orientation:landscape) and (max-height:500px){.drawer{max-height:100dvh}}
/* v6.13: mobile landscape ONLY (short viewports) — PC + portrait untouched.
   Controls sit slightly inside the edges (safe-area + minimal inset) so edge
   buttons show fully; servers/settings sheets stay compact, never fullscreen.
   v6.16: back-button (left) side of #topbar capped at 16px — his 2026-11-24
   order, the left space was far too big on his phone (cutout-side inset);
   server (right) side untouched. */
@media (orientation:landscape) and (max-height:500px){
  #topbar{padding:calc(10px + env(safe-area-inset-top, 0px)) calc(14px + env(safe-area-inset-right, 0px)) 10px min(16px, calc(2px + env(safe-area-inset-left, 0px)))}
  #botblock{padding:14px calc(14px + env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) min(16px, calc(2px + env(safe-area-inset-left, 0px)))}
  /* v6.19: center play/pause + 15s buttons show in landscape too (were phone-portrait only). */
  #centerCtl{display:flex}
  #srvPanel{width:min(252px,calc(100vw - 24px));right:10px;top:54px;max-height:calc(100dvh - 92px)}
  #srvPanel .popScroll{max-height:190px} /* v6.38: compact rows — 4 servers fit even in short landscape */
  /* v6.22: popups + settings card FILL the space from just below the
     header to just above the progress bar (his order — "header se leke
     progress bar ke theek upar tak", less scrolling, 5 languages at
     once). Compact rows/headers so 5 option rows and all 4 settings
     categories fit without scrolling on a ~390px-tall landscape
     viewport. Portrait + PC untouched. */
  .pop2{bottom:calc(80px + env(safe-area-inset-bottom, 0px));max-height:calc(100dvh - 136px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px))}
  .pop2 .popScroll{max-height:calc(100dvh - 192px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px))}
  /* v6.41: AUDIO sheet only, landscape — slightly taller (+16px, his order "minor sa barha do"). Subtitles + settings untouched (ID-scoped). */
  #audioSheet{max-height:calc(100dvh - 120px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px))}
  #audioSheet .popScroll{max-height:calc(100dvh - 176px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px))}
  .pop2 .popHead{padding:8px 16px}
  .pop2 .opt{padding:7px 12px}
  #settings{left:auto;right:12px;bottom:calc(80px + env(safe-area-inset-bottom, 0px));top:auto;width:min(356px,calc(100vw - 24px));max-width:none;max-height:calc(100dvh - 136px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));border-radius:6.4px}
  #settings .handle{display:none}
  #settings .drFoot{display:none}
  #settings #setSub{display:none}
  #settings .drHead{padding:8px 16px}
  #settings .drBody{padding:10px 10px 8px}
  #settings .acc-head{padding:8px 14px}
  #settings .sep{margin:6px 8px}
}
.handle{width:100px;height:5px;border-radius:999px;background:rgba(255,255,255,.25);margin:8px auto 0;flex:none;cursor:grab}
.drHead{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;
  padding:12px 16px;background:var(--bg)}
#settings .drHead{background:rgba(10,10,10,.55)}
.drHead .bkbtn{display:flex;align-items:center;gap:2px;margin-left:-8px;color:var(--fg);flex:none}
#setBack svg{stroke:currentColor;stroke-width:1.4px}
.drHead .bkbtn svg{width:20px;height:20px}
.drHead .bkbtn span{font-size:13px;line-height:18px}
.drHead .tt{flex:1;min-width:0}
.drHead .tt h3{display:flex;align-items:center;gap:6px;font-size:14px;line-height:20px;font-weight:500;
  text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
@media (min-width:768px){.drHead .tt h3{font-size:16px;line-height:24px}}
.drHead .tt h3 svg{width:20px;height:20px}
.drHead .tt p{font-size:13px;line-height:18px;color:var(--mut);text-transform:none;letter-spacing:0}
.drHead .xbtn{flex:none;color:var(--mut)}
.drHead .xbtn svg{width:20px;height:20px}
.drBody{flex:1;overflow-y:auto;padding:10px 10px 24px;scrollbar-width:thin}
.sep{margin:18px 8px;border:0;border-top:1px solid var(--bd)}
/* settings accordion */
.acc-head{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;border-radius:8px;
  padding:12px 14px;font-size:14px;line-height:20px;font-weight:600;text-align:left;transition:background-color .15s;animation:rowIn .3s ease-out both}
.acc-head>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

@media (min-width:768px){.acc-head{font-size:16px;line-height:24px}}
.acc-head .chev{transition:transform .2s;color:var(--mut)}
.acc-head .acc-val{margin-left:auto;margin-right:10px;min-width:0;max-width:58%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;line-height:16px;font-weight:400;color:var(--mut)}
.acc-head .chev svg{width:18px;height:18px}
.acc.open .acc-head .chev{transform:rotate(90deg)}
.acc.open .acc-head{background:transparent;border-bottom:1px solid var(--bd)}
.acc-head .acc-back{display:none;flex:none;color:var(--fg)}
.acc-head .acc-back svg{width:24px;height:24px;stroke:currentColor;stroke-width:1.4px}
.acc.open .acc-head .acc-back{display:flex}
.acc-head .acc-lab{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc-body{display:none;padding:4px 0 10px}
.acc.open .acc-body{display:block}
#setBody.sub .acc{display:none}
#setBody.sub .acc.open{display:block}
#setBody.sub .sep{display:none}
.bkrow{display:flex;align-items:center;gap:8px;width:100%;border-radius:8px;padding:8px 12px;
  font-size:13px;line-height:18px;color:var(--mut);text-align:left}
.bkrow:hover{background:rgba(38,38,38,.6);color:var(--fg)}
.bkrow svg{width:18px;height:18px;flex:none}
.srow{display:flex;width:100%;align-items:center;gap:12px;border-radius:8px;padding:12px 14px;margin:2px 0;animation:rowIn .3s ease-out both;
  font-size:14px;line-height:20px;text-align:left;transition:background-color .15s}
.srow:hover{background:rgba(38,38,38,.7)}
@media (min-width:768px){.srow{font-size:16px;line-height:24px}}
.srow .ic{flex:none;color:var(--mut)}
.srow .ic svg{width:20px;height:20px}
.srow .lb{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .vl{color:var(--mut);font-size:13px;line-height:18px;flex:none}
.srow.sel{background:var(--acc)}
.srow .vl{display:flex;align-items:center}
.srow .vl svg{width:16px;height:16px;color:var(--primary)}
.srow .chev{color:var(--mut);flex:none}
.srow .chev svg{width:18px;height:18px}
.srow .tgl{flex:none;border-radius:999px;padding:2px 10px;font-size:12px;line-height:18px;font-weight:600}
.srow .tgl.on{background:var(--fg);color:#0a0a0a}
.srow .tgl.off{background:var(--acc);color:var(--mut)}
.cardnote{padding:12px;font-size:13px;line-height:19px;color:var(--mut)}
/* v6.3: Vidstuck's settings sheet ends in a Close button. */
.setClose{display:flex;width:100%;align-items:center;justify-content:center;border-radius:8px;
  margin-top:16px;padding:12px;font-size:14px;line-height:20px;font-weight:600;background:var(--acc)}

    probeLane(srv).then(function(r){

         the first usable server is certain, the probes are done for

       them as unusable, so a slow first server is never wrongly marked dead. */
    maybePreload(); /* the first usable server can still preload during the 650ms Ready delay */

    for (var i = 0; i < SERVERS.length; i++) {

$("setPopBody").addEventListener("click", onSettingsClick);
$("setBack").addEventListener("click", function(){ setView = "main"; renderSettings(); });
$("btnSet").addEventListener("click", function(){ setView = "main"; openSec = null; renderSettings(); openDrawer("settings"); });
$("btnCloseSet").addEventListener("click", closeDrawers); $("btnCloseSetFoot").addEventListener("click", closeDrawers);
$("setPopBack").addEventListener("click", function(){ closePops(); openDrawer("settings"); });

if (MEDIA_PLAY) {
  var iv = setInterval(function(){
    if (bestIdx >= 0) { clearInterval(iv); openPlayer(SERVERS[bestIdx].id, false); }
  }, 500);
  setTimeout(function(){ clearInterval(iv); }, 12000);
}
renderSrvPanel();
updatePlayIco();
</script>
